workspace:
  name: "期权分析"
  # 工作区级提示词设置（features.md / internals.md）——三层设置的**最上层**，
  # 按字段覆盖插件 config（DSH 设置 → 提示词档案 那一页）：
  #   内置默认  ←  插件 config  ←  本文件的 workspace 段（只写一个键也只覆盖那一个键）
  #
  #   global_prompt: <path>    开场白覆盖文件；本层是**相对会话 cwd** 的路径
  #                            （插件层是绝对路径）。不配 = 沿用插件层的值。
  #   persona_clear: true      清空 preset 自带的
  #                            "You are a coding agent powered by the {{model}} model."
  #                            （**默认行为**，本文件缺失时同样清空）
  #   persona_clear: false     保留 preset 原句（唯一的 opt-out）
  #   persona_prompt: <path>   用该文件正文**替换** persona 段（不配则清空）
  #   includeHarnessIdentity:  控制 DSH 第一方开场白
  #                            "You are an AI agent powered by DeepSeek Harness."
  #                            （插件层默认 false = 关闭）；写 true 可保留该句
  #
  # 下面这行是显式声明，等价于默认行为——留着便于一眼看出本工作区确实要清空。
  persona_clear: true
  system_prompts:
    default:
      name: "功能开发"
      file: doc/prompts/default.md
      parameters:
        temperature: 0.2
    ai:
      name: "分析师模式"
      file:
        - doc/prompts/ai.md
      parameters:
        temperature: 0.2
    dev:
      name: "期权开发模式"
      file:
        - doc/prompts/dev.md
      parameters:
        temperature: 0.2
