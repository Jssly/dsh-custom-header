workspace:
  name: "期权分析"
  #global_prompt: doc/prompts/global.md
  # 工作区级 persona 段覆盖（features.md / internals.md）：**不配置也默认清空** preset 自带的
  # "You are a coding agent powered by the {{model}} model."（本文件缺失时同样清空）。
  #   persona_prompt: <path>  用该文件正文**替换** persona 段（不配则清空）
  #   persona_clear: false    保留 preset 原句（唯一的 opt-out）
  # 下面这行是显式声明，等价于默认行为——留着便于一眼看出本工作区确实要清空。
  persona_clear: true
  system_prompts:
    default:
      name: "功能开发"
      file: doc/prompts/default.md
      parameters:
        temperature: 0.2
    ai:
      name: "分析师模式"
      file:
        - doc/prompts/ai.md
      parameters:
        temperature: 0.2
    dev:
      name: "期权开发模式"
      file:
        - doc/prompts/dev.md
      parameters:
        temperature: 0.2

