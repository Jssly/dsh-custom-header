# dsh-profile-selector — 静态模式挂载层
#
# 经 dsh plugin --profile web add file:$(pwd) 安装后，本 patch 把静态 Host
# 半区插入 web profile 的 loader。插件名与 package.json 的 name 一致。
# 动态模式（开发）不经过本文件：直接 cordis_define + cordis_run。
#
# inject: [connection, webServer] —— connection 服务（dsh-client-connection 提供）
# 先就绪才注册 /rpc 通道；webServer 是硬依赖：本插件用
# connection.register(ctx, '/rpc', handler) 把 owner 显式指定为自己的 ctx，
# register 内部执行 owner.effect(() => owner.webServer.register(route))，
# 需要该 ctx 能解析 webServer。缺声明会抛
# 「cannot get property "webServer" without inject」并回滚整个 loader entry。
# （DSH 0.1.5-alpha.1 起 connection.rpc.handle 已不可用——它的 owner 是服务侧
# 影子 Context，解析从 connection 插件 fiber 向上，调用方 inject 无效；
# 详见 internals.md / ops-notes.md。）
#
# config —— 提示词的**出厂默认层**。三层设置的优先级（见 core/settings.js）：
#
#     内置默认  ←  本行的 config  ←  工作区 .deepseek.yaml 的 workspace 段
#
# 高者**按字段**覆盖低者（「值覆盖」：工作区只写 persona_clear，不影响 global_prompt）。
#
# 设置面板（DSH 设置 → 提示词档案）编辑的就是这一层：保存时把新值写进**本文件末尾的
# 受管块**——由一对 `# >>> …:settings:begin` / `# <<< …:settings:end` 整行标记夹住
# （此处故意不写全标记字面量：标记按**整行**精确匹配识别，而注释里出现完整标记会让人
# 误以为文件里已经有块；识别规则与历史坑见 src/core/patch.js 的「标记识别」小节）。
# 受管块是一个顶层 `- id: dsh-profile-selector` 覆盖条目，按 id 命中下面 insert
# 定义的行。⚠️ 同一份 patch 里「先 insert、后同 id 顶层覆盖」成立（DSH 的
# applyEntryPatches 会把 insert 的行即时建索引），且覆盖对 `config` 是**整块替换**
# 而非深合并——所以受管块必须写全三个键，不能只写改动项。
#
# 三项的语义与默认值：
#   global_prompt           开场白覆盖文件；空串 = 不覆盖（默认）。
#                           插件层写**绝对路径**（这是插件的全局设置）；
#                           工作区层写**相对会话 cwd** 的路径（与档案 file 规则一致）。
#   persona_clear           true（默认）= 清空 preset 自带的第 2 句
#                           "You are a coding agent powered by the {{model}} model."；
#                           false = 保留原句。
#   includeHarnessIdentity  false（默认）= 关闭 DSH 第一方开场白（第 1 句）
#                           "You are an AI agent powered by DeepSeek Harness."；
#                           true = 保留。
#
# ⚠️ 本文件不再有顶层 `- id: system-prompt / config: includeHarnessIdentity: false`。
# 那句英文的开关已由本插件接管：DSH 的 system-prompt 只在**构造时**读自己的 config，
# 运行期改不了，而该段只注册在 global 层，所以插件在本会话的 agent 作用域注册同名
# `harness:identity` 段做 shadow —— 等效于那个布尔开关，且改完**不用重启 dsh web**、
# 还能按工作区覆盖。可见效果与原来的 `includeHarnessIdentity: false` 完全一致
# （本插件默认值就是 false）。
- insert:
    - id: dsh-profile-selector
      name: dsh-profile-selector
      inject: [connection, webServer]
      config:
        global_prompt: ""
        persona_clear: true
        includeHarnessIdentity: false
